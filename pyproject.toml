[project]
name = "pii-pipeline"
version = "0.1.0"
description = "PII detection and masking service for Polish text"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    # Heavy ML deps — require special env/Docker setup:
    # "transformers>=4.40.0",
    # "torch>=2.3.0",
    # "morfeusz2>=1.9.0",  # requires libmorfeusz2-dev system library
    # "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]
ml = [
    "transformers>=4.40.0",
    "torch>=2.3.0",
    "morfeusz2>=1.9.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
